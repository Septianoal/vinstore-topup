name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: topup
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vinstore
          POSTGRES_USER: vinstore
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vinstore -d vinstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vinstore
      SPRING_DATASOURCE_USERNAME: vinstore
      SPRING_DATASOURCE_PASSWORD: ci_password
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Beri izin eksekusi mvnw
        run: chmod +x mvnw

      - name: Build dan test
        run: ./mvnw -B verify

      - name: Build image Docker
        run: docker build -t vinstore-app:ci .