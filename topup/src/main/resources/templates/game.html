<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${game.name()} + ' - VinStore'">Game - VinStore</title>
    <style>
        /* ── Reset & Base ── */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0f0d15;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ── Decorative Background Orbs ── */
        body::before {
            content: '';
            position: fixed;
            top: -180px;
            right: -120px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(124,58,237,0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -200px;
            left: -150px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(236,72,153,0.2) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .orb-mid {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(168,85,247,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Navbar ── */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15,13,21,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-inner {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 1.35rem;
            font-weight: 800;
            background: linear-gradient(135deg, #7c3aed, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .back-link {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #a855f7;
        }

        .back-link svg {
            width: 16px;
            height: 16px;
        }

        /* ── Main Content ── */
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }

        /* ── Game Header ── */
        .game-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 36px;
        }

        .game-image {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid rgba(124,58,237,0.4);
            box-shadow: 0 0 20px rgba(124,58,237,0.15);
            flex-shrink: 0;
        }

        .game-header-info h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, #d4d4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-header-info p {
            color: #a1a1aa;
            font-size: 0.9rem;
            margin-top: 2px;
        }

        /* ── Section Headings ── */
        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #e4e4e7;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .icon {
            font-size: 1.1rem;
        }

        /* ── Product Grid ── */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        @media (max-width: 600px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ── Product Card (Radio Label) ── */
        .product-card-input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .product-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .product-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(124,58,237,0.08), rgba(168,85,247,0.04));
            opacity: 0;
            transition: opacity 0.25s;
        }

        .product-card:hover {
            transform: translateY(-2px) scale(1.01);
            border-color: rgba(168,85,247,0.35);
            box-shadow: 0 4px 20px rgba(124,58,237,0.12);
        }

        .product-card:hover::before {
            opacity: 1;
        }

        /* Selected state */
        .product-card-input:checked + .product-card {
            border-color: #a855f7;
            background: rgba(124,58,237,0.12);
            box-shadow: 0 0 0 1px rgba(168,85,247,0.3), 0 4px 24px rgba(124,58,237,0.2);
        }

        .product-card-input:checked + .product-card::before {
            opacity: 1;
            background: linear-gradient(135deg, rgba(124,58,237,0.1), rgba(236,72,153,0.05));
        }

        .product-card-input:checked + .product-card .product-radio-dot {
            border-color: #a855f7;
            background: #a855f7;
            box-shadow: inset 0 0 0 3px #0f0d15, 0 0 8px rgba(168,85,247,0.5);
        }

        .product-card-left {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .product-radio-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            background: transparent;
            flex-shrink: 0;
            transition: all 0.25s;
        }

        .product-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #e4e4e7;
        }

        .product-price {
            font-weight: 700;
            font-size: 0.95rem;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
            position: relative;
            z-index: 1;
        }

        /* ── Empty State ── */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            border: 1px dashed rgba(255,255,255,0.1);
            margin-bottom: 32px;
        }

        .empty-state .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .empty-state p {
            color: #a1a1aa;
            font-size: 1rem;
        }

        /* ── Form Card ── */
        .form-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 28px 24px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #d4d4d8;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: #1a1625;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input::placeholder {
            color: #52525b;
        }

        .form-input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168,85,247,0.15);
        }

        /* ── Error Messages ── */
        .error-message {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #f43f5e;
            font-size: 0.82rem;
            font-weight: 500;
            margin-top: 6px;
        }

        .error-message svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .product-error {
            margin-bottom: 20px;
        }

        /* ── Submit Button ── */
        .submit-btn {
            display: block;
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #7c3aed, #a855f7, #ec4899);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: inherit;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.2px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #6d28d9, #9333ea, #db2777);
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 14px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124,58,237,0.35), 0 0 60px rgba(168,85,247,0.15);
        }

        .submit-btn:hover::before {
            opacity: 1;
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn span {
            position: relative;
            z-index: 1;
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding: 40px 20px 32px;
            color: #52525b;
            font-size: 0.82rem;
            position: relative;
            z-index: 1;
        }

        .footer-brand {
            font-weight: 700;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── Animations ── */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-header {
            animation: fadeInUp 0.5s ease-out;
        }

        .product-grid {
            animation: fadeInUp 0.5s ease-out 0.1s both;
        }

        .form-card {
            animation: fadeInUp 0.5s ease-out 0.2s both;
        }

        .submit-btn {
            animation: fadeInUp 0.5s ease-out 0.3s both;
        }
    </style>
</head>
<body>
    <!-- Decorative orb -->
    <div class="orb-mid"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a th:href="@{/}" class="brand">🎮 VinStore</a>
            <a th:href="@{/}" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"/>
                    <path d="M12 19l-7-7 7-7"/>
                </svg>
                Kembali
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <!-- Game Header -->
        <div class="game-header">
            <img th:src="${game.imageUrl()}" th:alt="${game.name()}" class="game-image"/>
            <div class="game-header-info">
                <h1 th:text="${game.name()}">Nama Game</h1>
                <p>Top Up cepat &amp; aman</p>
            </div>
        </div>

        <!-- Form -->
        <form th:action="@{/games/{slug}/order(slug=${game.slug()})}" th:object="${orderForm}" method="post">

            <!-- Product Selection -->
            <h2 class="section-title"><span class="icon">💎</span> Pilih Nominal</h2>

            <!-- Empty state -->
            <div th:if="${#lists.isEmpty(products)}" class="empty-state">
                <div class="empty-icon">📦</div>
                <p>Belum ada produk untuk game ini.</p>
            </div>

            <!-- Product error -->
            <div th:if="${#fields.hasErrors('productId')}" class="error-message product-error">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span th:errors="*{productId}">Product error</span>
            </div>

            <!-- Product Grid -->
            <div th:unless="${#lists.isEmpty(products)}" class="product-grid">
                <th:block th:each="product : ${products}">
                    <input type="radio"
                           th:field="*{productId}"
                           th:value="${product.id()}"
                           th:id="'product-' + ${product.id()}"
                           class="product-card-input"/>
                    <label th:for="'product-' + ${product.id()}" class="product-card">
                        <div class="product-card-left">
                            <span class="product-radio-dot"></span>
                            <span class="product-name" th:text="${product.name()}">86 Diamonds</span>
                        </div>
                        <span class="product-price" th:text="'Rp ' + ${#numbers.formatDecimal(product.price(), 0, 'POINT', 0, 'COMMA')}">Rp 19.000</span>
                    </label>
                </th:block>
            </div>

            <!-- User Info Section -->
            <div class="form-card">
                <div class="form-group">
                    <label class="form-label" th:text="${game.userIdLabel()}">User ID</label>
                    <input type="text" th:field="*{gameUserId}" class="form-input" placeholder="Masukkan ID kamu"/>
                    <div th:if="${#fields.hasErrors('gameUserId')}" class="error-message">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <span th:errors="*{gameUserId}">User ID error</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email atau nomor WhatsApp</label>
                    <input type="text" th:field="*{contact}" class="form-input" placeholder="Untuk konfirmasi pesanan"/>
                    <div th:if="${#fields.hasErrors('contact')}" class="error-message">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <span th:errors="*{contact}">Contact error</span>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn"><span>Pesan Sekarang 🚀</span></button>
        </form>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 <span class="footer-brand">VinStore</span>. All rights reserved.</p>
    </footer>
</body>
</html>
