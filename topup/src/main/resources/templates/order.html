<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Dibuat - VinStore</title>
    <style>
        body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        table { border-collapse: collapse; width: 100%; }
        td { padding: 0.6rem; border-bottom: 1px solid #ddd; }
        td:first-child { color: #555; width: 40%; }
        .code { font-size: 1.5rem; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>
    <h1>Order berhasil dibuat</h1>
    <p>Simpan kode order ini:</p>
    <p class="code" th:text="${order.orderCode()}">VS-261017-A7K2Q9</p>

    <table>
        <tr><td>Game</td><td th:text="${order.gameName()}">Mobile Legends</td></tr>
        <tr><td>Nominal</td><td th:text="${order.productName()}">86 Diamonds</td></tr>
        <tr><td>User ID</td><td th:text="${order.gameUserId()}">12345</td></tr>
        <tr><td>Kontak</td><td th:text="${order.contact()}">email@contoh.com</td></tr>
        <tr><td>Total</td><td th:text="'Rp ' + ${#numbers.formatDecimal(order.totalPrice(), 0, 'POINT', 0, 'COMMA')}">Rp 22.000</td></tr>
        <tr><td>Status</td><td th:text="${order.status()}">PENDING</td></tr>
        <tr><td>Dibuat</td><td th:text="${#temporals.format(order.createdAt(), 'dd MMM yyyy HH:mm')}">17 Okt 2026 12:00</td></tr>
    </table>

    <p>Pembayaran akan tersedia pada tahap berikutnya.</p>
    <p><a th:href="@{/}">&larr; Kembali ke beranda</a></p>
</body>
</html>
