<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - VinStore Admin'">Admin</title>
    <style>
        body { font-family: sans-serif; max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; }
        .nav { display: flex; gap: 1rem; align-items: center; padding-bottom: 1rem;
               border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
        .nav form { margin-left: auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { text-align: left; padding: 0.6rem; border-bottom: 1px solid #ddd; }
        input[type=text], input[type=number], select { padding: 0.5rem; box-sizing: border-box; }
        .field input[type=text] { width: 100%; }
        .row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
        .error { color: #b00020; font-size: 0.9rem; }
        button, .button { padding: 0.5rem 1rem; cursor: pointer; }
    </style>
</head>
<body>
<nav th:fragment="nav" class="nav">
    <strong>VinStore Admin</strong>
    <a th:href="@{/admin}">Beranda</a>
    <a th:href="@{/admin/games}">Game</a>
    <a th:href="@{/admin/orders}">Order</a>
    <form th:action="@{/logout}" method="post"><button type="submit">Keluar</button></form>
</nav>
</body>
